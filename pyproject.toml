[project]
name = "siteflare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyansh", email = "saxenapriyansh95@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "playwright>=1.63.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.54",
]

[project.scripts]
siteflare = "siteflare:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
